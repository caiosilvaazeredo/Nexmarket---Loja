# Blueprint do Render — painel da Loja (Vite + React).
#
# Site estático: o Vite gera `dist/` e o Render serve. Toda a comunicação é
# direta com o Firestore, então não há servidor próprio aqui — as chaves
# públicas do Firebase já vivem no repositório (é assim que o Firebase
# funciona; o que protege os dados são as Security Rules).

services:
  - type: web
    name: nexmarket-loja
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    # SPA: qualquer rota do react-router precisa cair no index.html, senão um
    # F5 em /pedidos devolveria 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Os bundles do Vite carregam hash no nome: cache longo é seguro e
      # deixa o painel abrir instantâneo em visitas seguintes.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
